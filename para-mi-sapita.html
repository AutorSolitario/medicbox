<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>· · ·</title>
  <link rel="stylesheet" href="assets/css/sapita.css">
</head>
<body>
  <div class="cielo" aria-hidden="true">
    <div class="luz luz--1"></div>
    <div class="luz luz--2"></div>
  </div>

  <main class="hoja-sapita" id="hoja" style="visibility:hidden">
    <img class="sapito-img" src="assets/images/sapito-secreto.png" alt="Un sapito">
    <h1 class="titulo-sapita">Para mi Sapita 💙</h1>
    <p class="subtitulo-sapita">Hay palabras que no pertenecen a una página común. Por eso guardé estas solamente para usted.</p>

    <section class="carta-sapita">
      <!-- AQUÍ SE COLOCARÁ LA CARTA DEFINITIVA -->
    </section>

    <p class="firma-sapita">Con amor,<br>Su sapito 💙</p>

    <button class="cerrar-sapita" id="btn-cerrar">Cerrar nuestro rincón</button>
  </main>

  <script src="assets/js/sapita-content.js"></script>
  <script>
    function b64aBytes(b64){ return Uint8Array.from(atob(b64), c => c.charCodeAt(0)); }

    // Si no hay sesión válida, no mostramos nada y volvemos al acceso
    const keyB64 = sessionStorage.getItem("medicbox_sapita_key");
    if(!keyB64){
      location.replace("acceso-sapita.html");
    }else{
      mostrarCarta().catch(() => location.replace("acceso-sapita.html"));
    }

    async function mostrarCarta(){
      const cfg = window.SAPITA_CIFRADO;
      const iv = b64aBytes(cfg.iv), ct = b64aBytes(cfg.contenido);
      const raw = b64aBytes(keyB64);
      const key = await crypto.subtle.importKey("raw", raw, { name:"AES-GCM" }, false, ["decrypt"]);
      // Si la clave guardada no corresponde, esto lanza excepción y no se muestra la carta
      const plano = await crypto.subtle.decrypt({ name:"AES-GCM", iv }, key, ct);
      const texto = new TextDecoder().decode(plano);

      document.querySelector(".carta-sapita").innerHTML = texto;
      const hoja = document.getElementById("hoja");
      hoja.style.visibility = "visible";

      // Corazones y estrellas decorativos
      const cielo = document.querySelector(".cielo");
      for(let i=0;i<12;i++){
        const e = document.createElement("div");
        e.className = "corazon-flota"; e.textContent = "💙";
        e.style.left = Math.random()*100 + "vw";
        e.style.fontSize = (12 + Math.random()*16) + "px";
        e.style.animationDuration = (10 + Math.random()*8) + "s";
        e.style.animationDelay = (Math.random()*8) + "s";
        cielo.appendChild(e);
      }
    }

    // "Cerrar nuestro rincón": elimina el acceso temporal, oculta la carta y vuelve a Nosotros
    document.getElementById("btn-cerrar").addEventListener("click", () => {
      sessionStorage.removeItem("medicbox_sapita_key");
      document.querySelector(".carta-sapita").innerHTML = "";
      document.getElementById("hoja").style.visibility = "hidden";
      location.replace("nosotros.html");
    });
  </script>
</body>
</html>
