<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>· · ·</title>
  <link rel="stylesheet" href="assets/css/sapita.css">
</head>

<body class="cuerpo-diario">

  <!-- Fondo con partículas (se llenan por JS) -->
  <div class="cielo" id="particulas" aria-hidden="true">
    <div class="luz luz--1"></div>
    <div class="luz luz--2"></div>
  </div>

  <main class="tarjeta-sapita" id="acceso">
    <img class="sapito-img" src="assets/images/sapito-secreto.png" alt="Un pequeño sapito">

    <h1 class="titulo-sapita">Encontraste nuestro rincón</h1>
    <p class="texto-sapita">
      Algunos lugares existen solo para la persona correcta.
      Si sabe nuestra frase, este rincón se abrirá para usted. 💙
    </p>

    <label class="etiqueta-sapita" for="frase">Escriba nuestra frase secreta</label>
    <input
      class="campo-sapita"
      id="frase"
      type="password"
      autocomplete="off"
      placeholder="Algo que solo nosotros sabemos"
      aria-describedby="mensaje">

    <button class="btn-sapita" id="btn-entrar" type="button">Entrar a nuestro rincón</button>

    <p class="mensaje-sapita" id="mensaje" role="status" aria-live="polite"></p>

    <a class="enlace-sapita" href="nosotros.html">Volver</a>
  </main>

  <script>
    "use strict";

    /* La frase secreta va aquí, en texto plano (es solo un detalle romántico). */
    const FRASE_SECRETA = "Podriacuidarmicorazon?";

    const campo   = document.getElementById("frase");
    const boton   = document.getElementById("btn-entrar");
    const mensaje = document.getElementById("mensaje");

    function normalizar(txt) {
      return txt.trim().toLowerCase();
    }

    function intentarEntrar() {
      if (normalizar(campo.value) === normalizar(FRASE_SECRETA)) {
        // Marca de acceso válido para esta pestaña
        sessionStorage.setItem("sapita_ok", "1");
        mensaje.textContent = "";
        mensaje.classList.remove("mensaje-sapita--error");
        document.getElementById("acceso").classList.add("acceso--abriendo");
        setTimeout(() => location.href = "para-mi-sapita.html", 550);
      } else {
        mensaje.textContent = "Esa no es nuestra frase secreta 💙";
        mensaje.classList.add("mensaje-sapita--error");
        campo.select();
      }
    }

    boton.addEventListener("click", intentarEntrar);
    campo.addEventListener("keydown", (e) => { if (e.key === "Enter") intentarEntrar(); });
    campo.focus();
  </script>

</body>
</html>
